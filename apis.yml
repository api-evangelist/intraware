name: Intraware
description: >-
  Intraware, Inc. was a software delivery and entitlement-management company
  founded in 1996 and headquartered in Orinda, California. Its flagship
  SubscribeNet service gave enterprise software publishers a web-based
  electronic software delivery (ESD) and license-management platform, delivering
  applications through an encryption, compression, and multi-server distribution
  engine while giving corporate IT subscribers account-specific entitlement,
  update, and download information. Intraware went public on NASDAQ under the
  ticker ITRA in 1999 during the dot-com boom, was backed by investors including
  Canaan Partners, and was acquired in 2009 by Acresso Software (later Flexera
  Software). Its SubscribeNet software-monetization capabilities live on today as
  part of Revenera; there is no independent Intraware developer program, public
  API, or documentation surface. This profile was surfaced as a Canaan Partners
  portfolio company and is retained as a historical VC-portfolio lead.
